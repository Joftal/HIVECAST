# HIVECAST GitHub Issues 标准标签体系
# 修改本文件后，GitHub Actions（Sync Issue Labels）会自动同步到仓库。

# ---- 类型（Type）----
- name: "type: bug"
  color: "d73a4a"
  description: "程序异常、崩溃或与预期不符的缺陷"
- name: "type: platform-fix"
  color: "e96d4c"
  description: "直播平台改版、风控或接口变动导致的抓取/录制失效"
- name: "type: enhancement"
  color: "2f6bff"
  description: "新功能、新平台适配或体验优化建议"
- name: "type: question"
  color: "8b5cf6"
  description: "安装配置、FFmpeg 或日常使用咨询"
- name: "type: docs"
  color: "06b6d4"
  description: "文档、说明或发布指引改进"

# ---- 状态（Status）----
- name: "status: needs-triage"
  color: "fbca04"
  description: "新提交，待维护者分类与评估"
- name: "status: needs-info"
  color: "d4c5f9"
  description: "需要补充版本号、复现步骤或脱敏日志"
- name: "status: confirmed"
  color: "f0a23c"
  description: "已复现或已确认纳入排期"
- name: "status: in-progress"
  color: "0ea5e9"
  description: "正在开发或修复中"
- name: "status: wontfix"
  color: "94a3b8"
  description: "不计划修复、设计如此或重复提交"

# ---- 优先级（Priority）----
- name: "priority: high"
  color: "b60205"
  description: "高优先级：崩溃、丢录像或核心流程阻断"
- name: "priority: medium"
  color: "f59e0b"
  description: "中优先级：常规功能缺陷或重要体验问题"
- name: "priority: low"
  color: "6b7280"
  description: "低优先级：边缘场景或细节打磨"

# ---- 直播平台（Platform）----
- name: "platform: bilibili"
  color: "fb7299"
  description: "哔哩哔哩直播相关"
- name: "platform: douyu"
  color: "ff7700"
  description: "斗鱼直播相关"
- name: "platform: huya"
  color: "f59e0b"
  description: "虎牙直播相关"
- name: "platform: douyin"
  color: "1f2937"
  description: "抖音直播相关"

# ---- 操作系统（OS）----
- name: "os: macos"
  color: "64748b"
  description: "macOS (Apple Silicon / Intel) 相关"
- name: "os: windows"
  color: "2563eb"
  description: "Windows 10/11 (x64) 相关"

# ---- 功能模块（Area）----
- name: "area: recorder"
  color: "e5484d"
  description: "直播监控、开播检测与流录制"
- name: "area: danmaku"
  color: "7c3aed"
  description: "弹幕 WebSocket 捕获、同步与导出"
- name: "area: postprocess"
  color: "d97706"
  description: "FFmpeg 转封装、多段合并与后处理"
- name: "area: playback"
  color: "0e9f5f"
  description: "本地回放、画廊与媒体管理"
- name: "area: auth"
  color: "0284c7"
  description: "平台扫码登录、Cookie 存储与续期"
- name: "area: installer"
  color: "4f46e5"
  description: "DMG / Windows 液态玻璃安装器、更新检测与发布包"
- name: "area: ui"
  color: "0891b2"
  description: "界面交互、主题样式与中英文国际化"
