name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（SemVer，不带 v；正式版例 0.2.0，预发布例 0.2.0-rc.1）'
        required: true
        type: string
      prerelease:
        description: '发布为预发布版（必须与版本号的 - 后缀一致）'
        required: true
        default: false
        type: boolean
      publish:
        description: '创建 GitHub Release（取消勾选则只构建并保留 workflow artifact）'
        required: true
        default: false
        type: boolean
      sign_macos:
        description: '使用 Apple Developer ID 签名并公证 macOS 安装包（无证书开源发布保持取消勾选）'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: build-release-${{ inputs.version }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Check SemVer and release channel
        id: check
        env:
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          SEMVER='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?$'
          if [[ ! "$VERSION" =~ $SEMVER ]]; then
            echo "::error::版本号必须是 SemVer，例如 0.2.0 或 0.2.0-rc.1，不能带 v 前缀"
            exit 1
          fi
          if [[ "$VERSION" == *-* ]]; then IS_PRE=true; else IS_PRE=false; fi
          if [[ "$IS_PRE" != "$PRERELEASE" ]]; then
            echo "::error::版本号 $VERSION 与 prerelease=$PRERELEASE 不一致：带 - 后缀必须勾选预发布，正式版不能勾选"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macOS-arm64
            artifact: macos-arm64
          - os: windows-2022
            platform: Windows-x64
            artifact: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          version: 12.23.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
          cache: true
          # 不让无关警告阻断发布；真正的编译错误仍会失败。
          build-warnings: warn

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Inject version
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: node scripts/ci/set-version.mjs "$VERSION"

      - name: Check docs and i18n
        shell: bash
        run: |
          pnpm check:docs
          pnpm check:i18n
          node --test scripts/ci/release-regression.test.mjs

      - name: Test Rust core
        shell: bash
        run: |
          set -euo pipefail
          cd src-tauri
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked --lib
          cargo test --manifest-path ipc-types/Cargo.toml --locked
          cargo fmt --manifest-path installer-win/Cargo.toml --check
          cargo clippy --manifest-path installer-win/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path installer-win/Cargo.toml --locked

      - name: Build macOS app
        if: runner.os == 'macOS'
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          pnpm tauri build --bundles app

      - name: Package and verify macOS distribution
        if: runner.os == 'macOS'
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          HIVECAST_PUBLIC_MACOS: ${{ inputs.sign_macos && 'true' || 'false' }}
          APPLE_SIGNING_IDENTITY: ${{ inputs.sign_macos && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_CERTIFICATE: ${{ inputs.sign_macos && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ inputs.sign_macos && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ inputs.sign_macos && secrets.APPLE_ID || '' }}
          APPLE_TEAM_ID: ${{ inputs.sign_macos && secrets.APPLE_TEAM_ID || '' }}
          APPLE_PASSWORD: ${{ inputs.sign_macos && secrets.APPLE_PASSWORD || '' }}
        run: |
          set -euo pipefail
          bash scripts/build-dmg.sh --no-build
          mkdir -p release-assets
          dmg="release-assets/HIVECAST-v${VERSION}-macOS-arm64.dmg"
          cp "src-tauri/target/release/bundle/dmg/HIVECAST_${VERSION}_$(uname -m).dmg" "$dmg"
          shasum -a 256 "$dmg"

      - name: Smoke test macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mount="$(mktemp -d)"
          trap 'hdiutil detach "$mount" >/dev/null; rmdir "$mount"' EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" release-assets/*.dmg
          bundle="$mount/HIVECAST.app"
          codesign --verify --deep --strict "$bundle"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$bundle/Contents/Info.plist")"
          "$bundle/Contents/MacOS/$executable" >/tmp/hivecast-smoke.log 2>&1 &
          pid=$!
          sleep 10
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "::error::应用启动后 10 秒内退出"
            cat /tmp/hivecast-smoke.log
            exit 1
          fi
          kill "$pid"
          wait "$pid" 2>/dev/null || true

      - name: Build Windows Liquid Glass installer and portable zip
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          pnpm tauri build --no-bundle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = "src-tauri/target/release/hivecast.exe"
          if (-not (Test-Path $exe)) { throw "未找到 $exe" }

          cargo build --manifest-path src-tauri/installer-win/Cargo.toml --release --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $stub = "src-tauri/installer-win/target/release/hivecast-installer.exe"
          if (-not (Test-Path $stub)) { throw "未找到 $stub" }

          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $setupOut = "release-assets/HIVECAST-v$env:VERSION-Windows-x64-setup.exe"
          . ./scripts/ci/windows-process.ps1
          Invoke-Installer $stub @("--pack", $stub, $exe, $env:VERSION, $setupOut)

          $stage = Join-Path $env:RUNNER_TEMP "portable-stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item $exe "$stage/HIVECAST.exe"
          $zipOut = "release-assets/HIVECAST-v$env:VERSION-Windows-x64-portable.zip"
          Compress-Archive -Path "$stage/HIVECAST.exe" -DestinationPath $zipOut -Force
          Get-FileHash $setupOut, $zipOut -Algorithm SHA256 | Format-Table -AutoSize

      - name: Smoke test Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $expectedHash = (Get-FileHash "src-tauri/target/release/hivecast.exe").Hash

          # 1. Verify modern Liquid Glass installer SFX self-test, silent install, launch, and silent uninstall.
          $setup = Get-Item "release-assets/*-Windows-x64-setup.exe"
          . ./scripts/ci/windows-process.ps1
          Invoke-Installer $setup.FullName @("--self-test")
          $installDir = Join-Path $env:RUNNER_TEMP "HIVECAST 安装测试"
          Invoke-Installer $setup.FullName @("--silent", "--dir", $installDir, "--no-shortcut")

          $installedExe = Join-Path $installDir "HIVECAST.exe"
          $uninstExe = Join-Path $installDir "uninstall.exe"
          if (-not (Test-Path $installedExe)) { throw "静默安装后未找到 HIVECAST.exe" }
          if (-not (Test-Path $uninstExe)) { throw "静默安装后未找到 uninstall.exe" }
          if ((Get-FileHash $installedExe).Hash -ne $expectedHash) {
            throw "安装版 HIVECAST.exe 哈希校验失败"
          }
          $regPath = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\HIVECAST"
          $reg = Get-ItemProperty -Path $regPath
          if ($reg.DisplayVersion -ne $env:VERSION) {
            throw "卸载注册表版本不匹配: $($reg.DisplayVersion)"
          }

          $p = Start-Process -FilePath $installedExe -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) {
            Write-Error "安装版启动后 10 秒内退出，exit=$($p.ExitCode)"
            exit 1
          }
          Stop-Process -Id $p.Id -Force
          Start-Sleep -Seconds 1

          # 验证 Windows 安装目录优先模式：data / cache / logs / webview / Recording 全部落在安装目录内。
          foreach ($sub in @("data\hivecast.db", "data\secret.bin", "cache", "logs", "webview", "Recording")) {
            if (-not (Test-Path -LiteralPath (Join-Path $installDir $sub))) {
              throw "安装目录优先模式未在安装目录生成预期路径：$sub"
            }
          }

          Invoke-Installer $uninstExe @("--uninstall", "--silent", "--dir", $installDir)
          $deadline = [DateTime]::UtcNow.AddSeconds(30)
          while ((Test-Path -LiteralPath $uninstExe) -and [DateTime]::UtcNow -lt $deadline) {
            Start-Sleep -Milliseconds 200
          }
          if (Test-Path -LiteralPath $installedExe) { throw "静默卸载后 HIVECAST.exe 仍存在" }
          if (Test-Path -LiteralPath $uninstExe) { throw "静默卸载后 uninstall.exe 仍存在" }
          if (Test-Path $regPath) { throw "静默卸载后卸载注册表仍存在" }
          $startShortcut = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\HIVECAST.lnk"
          if (Test-Path -LiteralPath $startShortcut) { throw "静默卸载后开始菜单快捷方式仍存在" }
          # 默认卸载应清除程序与运行期缓存/日志/webview，仅保留用户数据 data/ 与录像目录 Recording/。
          $remaining = @(Get-ChildItem -Force -LiteralPath $installDir | Select-Object -ExpandProperty Name | Sort-Object)
          if (($remaining -join ',') -ne 'data,Recording') {
            throw "默认卸载后安装目录残留不符合预期（期望 data,Recording）：$($remaining -join ', ')"
          }
          if (-not (Test-Path -LiteralPath (Join-Path $installDir "data\hivecast.db"))) {
            throw "默认卸载后 data\hivecast.db 被误删"
          }

          # 验证卸载保留 data/ + Recording/ 后，重新安装到原目录可以无缝复用，且 --purge-data 可清除 data/ 仍保留 Recording/。
          Invoke-Installer $setup.FullName @("--silent", "--dir", $installDir, "--no-shortcut")
          Invoke-Installer $uninstExe @("--uninstall", "--silent", "--dir", $installDir, "--purge-data")
          $deadline = [DateTime]::UtcNow.AddSeconds(30)
          while ((Test-Path -LiteralPath $uninstExe) -and [DateTime]::UtcNow -lt $deadline) {
            Start-Sleep -Milliseconds 200
          }
          $afterPurge = @(Get-ChildItem -Force -LiteralPath $installDir | Select-Object -ExpandProperty Name)
          if ($afterPurge.Count -ne 1 -or $afterPurge[0] -ne "Recording") {
            throw "--purge-data 卸载后应仅保留 Recording/，实际：$($afterPurge -join ', ')"
          }

          # 2. Verify portable zip extract & SHA-256.
          $zip = Get-Item "release-assets/*-Windows-x64-portable.zip"
          $folder = Join-Path $env:RUNNER_TEMP "绿色版 smoke"
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $folder
          $exe = Join-Path $folder "HIVECAST.exe"
          if ((Get-FileHash $exe).Hash -ne $expectedHash) {
            throw "绿色版解压校验失败"
          }
          Write-Host "smoke ok (installer + portable) pid=$($p.Id)"
          ./scripts/ci/windows-upgrade-smoke.ps1 -Setup $setup.FullName -Stub "src-tauri/installer-win/target/release/hivecast-installer.exe"

      - name: Upload packaged artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hivecast-${{ matrix.artifact }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [validate, build]
    if: inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout full git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version

      - name: Download packaged artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.validate.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
          SIGN_MACOS: ${{ inputs.sign_macos }}
        run: |
          set -euo pipefail
          case "$VERSION" in
            *-*) IS_PRE=true ;;
            *) IS_PRE=false ;;
          esac
          if [[ "$IS_PRE" != "$PRERELEASE" ]]; then
            echo "::error::版本号与 prerelease 输入不一致"
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::tag v$VERSION 已存在，拒绝覆盖发布"
            exit 1
          fi
          (cd release-assets && sha256sum HIVECAST-* > SHA256SUMS.txt)
          ls -lh release-assets
          cat release-assets/SHA256SUMS.txt

          node scripts/ci/generate-release-notes.mjs \
            --version "$VERSION" \
            --sign-macos "$SIGN_MACOS" \
            --repo "$GITHUB_REPOSITORY" \
            --to "$GITHUB_SHA" \
            --out release-notes.md
          cat release-notes.md

          args=()
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          else
            args+=(--latest)
          fi
          gh release create "v$VERSION" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "HIVECAST v$VERSION" \
            --notes-file release-notes.md \
            "${args[@]}"

  publish-changelog:
    needs: release
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-changelog.yml
