name: Auto Triage Issues

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write
  contents: read

jobs:
  triage:
    name: Auto-label issue from form fields
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Reconcile labels derived from the issue form
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module - <<'NODE'
          import { readFileSync } from "node:fs";
          import { reconcileLabels } from "./scripts/ci/issue-labels.mjs";
          const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, "utf8"));
          await reconcileLabels(event.issue.url, event.changes?.body?.from, {
            Authorization: "Bearer " + process.env.GH_TOKEN,
            Accept: "application/vnd.github+json",
            "Content-Type": "application/json"
          });
          NODE
