name: Deploy Changelog & Update Feed

on:
  release:
    types: [published, edited, deleted]
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths:
      - scripts/ci/generate-changelog-site.mjs
      - src/assets/app-icon.png
      - src-tauri/icons/128x128.png
      - .github/workflows/deploy-changelog.yml

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: deploy-changelog
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & publish GitHub Pages + jsDelivr feed
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version

      - name: Generate changelog site and JSON feeds
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/generate-changelog-site.mjs --out dist-site

      - name: Push to gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd dist-site
          git init
          git checkout -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: sync changelog site and update feed"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" gh-pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: dist-site

      - name: Deploy Pages
        id: pages
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

      - name: Purge jsDelivr CDN cache
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          curl --retry 3 -fsS "https://purge.jsdelivr.net/gh/${GH_REPO}@gh-pages/changelog.json" \
            || echo "::warning::jsDelivr purge failed for changelog.json (Pages and gh-pages were already updated)"
          curl --retry 3 -fsS "https://purge.jsdelivr.net/gh/${GH_REPO}@gh-pages/latest.json" \
            || echo "::warning::jsDelivr purge failed for latest.json (Pages and gh-pages were already updated)"
