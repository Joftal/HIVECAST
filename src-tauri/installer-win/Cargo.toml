[package]
name = "hivecast-installer"
version = "0.1.0"
description = "HIVECAST Windows modern Liquid Glass installer"
edition = "2021"
rust-version = "1.89"

[dependencies]
rusqlite = { version = "=0.43.0", features = ["bundled"] }
flate2 = "=1.1.11"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"

tempfile = "=3.27.0"

[target.'cfg(windows)'.dependencies]
base64 = "=0.23.1"
tao = "=0.37.2"
wry = "=0.57.1"
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Dwm",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
tauri-winres = "=0.3.7"
