[package]
name = "hivecast"
version = "0.1.0"
description = "HIVECAST desktop app"
edition = "2021"
rust-version = "1.77"

[lib]
name = "hivecast_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "signal", "fs", "sync", "time", "net", "io-util"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
hivecast-ipc = { path = "ipc-types" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
async-trait = "0.1"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
rusqlite = { version = "0.37", features = ["bundled"] }
tauri-plugin-notification = "2"
fs4 = { version = "0.13", features = ["sync"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
brotli = "7"
flate2 = "1"
md5 = "0.7"
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
