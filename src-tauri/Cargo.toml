[package]
name = "hivecast"
version = "0.1.0"
description = "HIVECAST desktop app"
edition = "2021"
rust-version = "1.77"

[lib]
name = "hivecast_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon", "image-png"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "process", "signal", "fs", "sync", "time", "net", "io-util"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
thiserror = "=2.0.21"
uuid = { version = "=1.29.0", features = ["v4"] }
anyhow = "=1.0.104"
hivecast-ipc = { path = "ipc-types" }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "json", "gzip"] }
async-trait = "=0.1.92"
url = "=2.5.8"
chrono = { version = "=0.4.45", default-features = false, features = ["std", "clock"] }
rusqlite = { version = "=0.37.0", features = ["bundled"] }
tauri-plugin-notification = "=2.8.0"
fs4 = { version = "=0.13.1", features = ["sync"] }
tokio-tungstenite = { version = "=0.24.0", features = ["rustls-tls-native-roots", "native-tls"] }
native-tls = "=0.2.18"
futures-util = "=0.3.34"
brotli = "=7.0.0"
flate2 = "=1.1.10"
md5 = "=0.7.0"
base64 = "=0.22.1"
aes-gcm = "=0.10.3"
rsa = { version = "=0.9.10", features = ["sha2"] }
sha2 = "=0.10.9"
rand = "=0.8.8"
tauri-plugin-dialog = "=2.8.4"
qrcode = { version = "=0.14.1", features = ["svg"], default-features = false }
rquickjs = "=0.9.0"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"
